[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vao-blender-core"
version = "0.4.0rc2"
description = "Blender-neutral validation core for the VAO-Blender extension"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",
  "rfc3987==1.3.8",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = ["ruff==0.16.4"]

[tool.setuptools.packages.find]
include = ["vao_blender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/blender/*.py" = ["E402"]
