name: Native release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require exact final annotated-tag ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="$(python3 -c 'import tomllib; print(tomllib.load(open("release_metadata.toml", "rb"))["release_tag"])')"
          expected_status="$(python3 -c 'import tomllib; print(tomllib.load(open("release_metadata.toml", "rb"))["status"])')"
          test "${GITHUB_REF}" = "refs/tags/${expected_tag}"
          test "${expected_status}" = "prerelease"
          test "$(git cat-file -t "${expected_tag}")" = "tag"
          test "$(git rev-list -n 1 "${expected_tag}")" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

  build:
    name: Canonical immutable base release
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.13"
      - name: Install pinned runtime dependencies offline
        run: >-
          python -m pip install --no-index --find-links wheels
          attrs==26.1.0 jsonschema==4.26.0
          jsonschema-specifications==2025.9.1 referencing==0.37.0
          rfc3339-validator==0.1.4 rfc3987==1.3.8 rfc8785==0.1.4
          rpds-py==2026.6.3 six==1.17.0
      - name: Re-run source release audit
        run: python scripts/release_audit.py
      - name: Revalidate citation and SBOM against pinned official schemas
        shell: bash
        run: |
          set -euo pipefail
          cff_url="$(python -c 'import tomllib; print(tomllib.load(open("release_metadata.toml", "rb"))["citation"]["schema_url"])')"
          cff_sha="$(python -c 'import tomllib; print(tomllib.load(open("release_metadata.toml", "rb"))["citation"]["schema_sha256"])')"
          spdx_url="$(python -c 'import tomllib; print(tomllib.load(open("release_metadata.toml", "rb"))["spdx"]["schema_url"])')"
          spdx_sha="$(python -c 'import tomllib; print(tomllib.load(open("release_metadata.toml", "rb"))["spdx"]["schema_sha256"])')"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 5 \
            --output "${RUNNER_TEMP}/cff-schema.json" "${cff_url}"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 5 \
            --output "${RUNNER_TEMP}/spdx-schema.json" "${spdx_url}"
          echo "${cff_sha}  ${RUNNER_TEMP}/cff-schema.json" | sha256sum --check --strict
          echo "${spdx_sha}  ${RUNNER_TEMP}/spdx-schema.json" | sha256sum --check --strict
          python - "${RUNNER_TEMP}/cff-schema.json" "${RUNNER_TEMP}/spdx-schema.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft7Validator

          for schema_path, document_path in zip(
              sys.argv[1:], ("CITATION.cff", "SBOM.spdx.json"), strict=True
          ):
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              document = json.loads(Path(document_path).read_text(encoding="utf-8"))
              Draft7Validator.check_schema(schema)
              Draft7Validator(schema).validate(document)
          PY
      - name: Fetch and probe the canonical official builder
        id: blender
        run: >-
          python scripts/prepare_native_blender.py
          --blender-version 5.2.1
          --platform linux-x64
          --runner-image ubuntu-24.04
          --destination "${RUNNER_TEMP}/canonical-blender"
      - name: Build and verify the exact tagged base set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_extension.py \
            --blender "${{ steps.blender.outputs.blender_path }}" --overwrite
          release_dir="dist/release-candidate/0.4.0-rc.2"
          (cd "${release_dir}" && sha256sum --check --strict SHA256SUMS)
          python scripts/native_evidence.py template \
            --release-dir "${release_dir}" > "${RUNNER_TEMP}/native-template.json"
      - name: Transfer immutable base set to native jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vao-blender-0.4.0-rc.2-base-release-attempt-${{ github.run_attempt }}
          path: dist/release-candidate/0.4.0-rc.2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    name: Blender ${{ matrix.blender }} / ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "5.1.2"
            platform: windows-x64
            runner: windows-2025
          - blender: "5.1.2"
            platform: macos-arm64
            runner: macos-15
          - blender: "5.1.2"
            platform: linux-x64
            runner: ubuntu-24.04
          - blender: "5.2.1"
            platform: windows-x64
            runner: windows-2025
          - blender: "5.2.1"
            platform: macos-arm64
            runner: macos-15
          - blender: "5.2.1"
            platform: linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.13"
      - name: Install pinned host dependencies offline
        run: >-
          python -m pip install --no-index --find-links wheels
          attrs==26.1.0 jsonschema==4.26.0
          jsonschema-specifications==2025.9.1 referencing==0.37.0
          rfc3339-validator==0.1.4 rfc3987==1.3.8 rfc8785==0.1.4
          rpds-py==2026.6.3 six==1.17.0
      - name: Download the immutable base release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vao-blender-0.4.0-rc.2-base-release-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vao-base-release
      - name: Validate the transferred base release
        run: >-
          python scripts/native_evidence.py template
          --release-dir "${{ runner.temp }}/vao-base-release"
      - name: Fetch and probe the exact official native Blender host
        id: blender
        run: >-
          python scripts/prepare_native_blender.py
          --blender-version "${{ matrix.blender }}"
          --platform "${{ matrix.platform }}"
          --runner-image "${{ matrix.runner }}"
          --destination "${{ runner.temp }}/native-blender"
      - name: Exercise exact installed bytes and write one evidence cell
        run: >-
          python scripts/run_native_release_cell.py
          --blender "${{ steps.blender.outputs.blender_path }}"
          --blender-executable-sha256 "${{ steps.blender.outputs.blender_executable_sha256 }}"
          --release-dir "${{ runner.temp }}/vao-base-release"
          --blender-version "${{ matrix.blender }}"
          --platform "${{ matrix.platform }}"
          --source-commit "${{ github.sha }}"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
          --runner-image "${{ matrix.runner }}"
          --output "${{ runner.temp }}/native-cell-${{ matrix.blender }}-${{ matrix.platform }}.json"
      - name: Upload exact cell evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cell-attempt-${{ github.run_attempt }}-${{ matrix.blender }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-cell-${{ matrix.blender }}-${{ matrix.platform }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    name: Assemble verified detached publication set
    needs: [build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.13"
      - name: Download immutable base release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vao-blender-0.4.0-rc.2-base-release-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vao-publication-set
      - name: Download and merge all six cell files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-cell-attempt-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/native-cells
          merge-multiple: true
      - name: Merge, assemble, and verify detached evidence
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/vao-publication-set"
          python scripts/native_evidence.py merge \
            --release-dir "${release_dir}" --input-dir "${RUNNER_TEMP}/native-cells" \
            > "${RUNNER_TEMP}/completed-native-input.json"
          python scripts/native_evidence.py assemble \
            --release-dir "${release_dir}" \
            --input "${RUNNER_TEMP}/completed-native-input.json"
          python scripts/native_evidence.py verify --release-dir "${release_dir}"
          (cd "${release_dir}" && \
            sha256sum --check --strict PUBLICATION_SHA256SUMS)
      - name: Upload complete non-published publication set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vao-blender-0.4.0-rc.2-native-verified-publication-set-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vao-publication-set
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
