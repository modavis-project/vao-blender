name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core conformance and release audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned runtime wheels offline
        run: >-
          python -m pip install --no-index --find-links wheels
          jsonschema==4.26.0 rfc3339-validator==0.1.4
          rfc3987==1.3.8 rfc8785==0.1.4
      - name: Compile source
        run: python -m compileall -q vao_blender tests scripts
      - name: Unit and contract tests
        run: python -m unittest discover -s tests/unit -v
      - name: Release audit
        run: python scripts/release_audit.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.4"
          args: check
          src: >-
            vao_blender
            tests
            scripts
      - name: Formatting
        run: ruff format --check vao_blender tests scripts
